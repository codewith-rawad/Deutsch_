<body>
<div class="flagbar"></div>
<header class="top"><div class="wrap">
 <a class="brand" href="index.html">Deutsch <i>Rawad</i></a><div class="sp"></div>
 <div class="themes" id="themes"></div>
 <button class="pill" id="out" type="button">⏻ <span>خروج</span></button>
</div></header>

<main class="wrap">
 <section class="hero">
  <div>
   <h1 class="disp de">Deutsch<span>lernen.</span></h1>
   <p>تمارين قراءة وسمع بطريقة البطاقات: سؤال واحد بكل مرة، صورة، ترجمة، ونتيجة فورية.</p>
   <a class="btn" href="#lesen">ابدأ التمرين ←</a>
  </div>
  <div class="postcard stamp"><div class="in">
   <div class="photo"><img id="hp" alt="" src="https://images.unsplash.com/photo-1560969184-10fe8719e047?auto=format&fit=crop&w=900&q=70"></div>
  </div><div class="mark" id="hm">BERLIN<br>★ 2026 ★</div></div>
 </section>

 <section class="sec" id="lesen"><h2 class="disp de">Lesen <small>القراءة · 5 أجزاء</small></h2><div class="grid" id="gl"></div></section>
 <section class="sec" id="horen"><h2 class="disp de">Hören <small>السمع · 4 أجزاء</small></h2><div class="grid" id="gh"></div></section>
</main>
<footer>© 2026 Deutsch mit Rawad · <a href="https://t.me/mez123794" target="_blank" rel="noopener">@mez123794</a></footer>

<script src="supabase.js"></script>
<script>
if(!checkSession()){location.replace('login.html')}
mountThemes(document.getElementById('themes'));
document.getElementById('out').onclick=()=>logout();
const META={
 lesen1:['Teil 1','Geschichten · Richtig/Falsch','familie freund nachbar'],
 lesen2:['Teil 2','Fragen zum Text','schule lernen prüfung'],
 lesen3:['Teil 3','Anzeigen zuordnen','einkauf markt anzeige'],
 lesen4:['Teil 4','Meinungen · Ja/Nein','internet handy meinung'],
 lesen5:['Teil 5','Fortgeschrittene Texte','wald natur wandern'],
 horen1:['Teil 1','Alltag & Gespräche','telefon anruf'],
 horen2:['Teil 2','Ansagen & Telefon','bahn zug bus'],
 horen3:['Teil 3','Richtig oder Falsch','musik konzert'],
 horen4:['Teil 4','Wer hat das gesagt?','moderator radio']
};
function card(k){
 const m=META[k],a=document.createElement('a');a.className='stamp';a.href='viewer.html?file='+k;
 a.innerHTML=`<div class="in sk" data-k="${k}"></div>`;return a;
}
function fill(a,k,data){
 const m=META[k];let n=0,unit='';
 if(Array.isArray(data)){n=data.length;unit='قصة'}else if(data&&data.sections){n=data.sections.length;unit='جزء'}
 const done=Math.min(doneCount(k),n||0),pc=n?Math.round(done/n*100):0;
 const inn=a.firstChild;inn.className='in';inn.innerHTML=sceneFor(m[2],k.length)+`<div class="card-body"><h3 class="de">${m[0]} · ${m[1]}</h3><div class="meta"><span>${data?n+' '+unit:'تعذّر التحميل'}</span><span class="tag">${done}/${n||0}</span></div><div class="bar"><i style="width:${pc}%"></i></div></div>`;
}
const gl=document.getElementById('gl'),gh=document.getElementById('gh');
[['lesen1','lesen2','lesen3','lesen4','lesen5',gl],['horen1','horen2','horen3','horen4',gh]].forEach(arr=>{
 const g=arr.pop();
 arr.forEach(k=>{const c=card(k);g.appendChild(c);
  loadQuestionsFile(k).then(d=>fill(c,k,d)).catch(()=>fill(c,k,null));});
});
setTimeout(prefetchAll,800);
// Hero slider
const cities=[['photo-1560969184-10fe8719e047','BERLIN'],['photo-1605649487212-47bdab064df7','HAMBURG'],['photo-1529260830199-42c24126f198','KÖLN'],['photo-1496568816309-51d7c20e3b21','FRANKFURT'],['photo-1565008576549-57569a49371d','DRESDEN']];
let ci=0;const hp=document.getElementById('hp'),hm=document.getElementById('hm');
cities.forEach(c=>{const i=new Image();i.src=`https://images.unsplash.com/${c[0]}?auto=format&fit=crop&w=900&q=70`});
setInterval(()=>{ci=(ci+1)%cities.length;hp.style.opacity=0;setTimeout(()=>{hp.src=`https://images.unsplash.com/${cities[ci][0]}?auto=format&fit=crop&w=900&q=70`;hm.innerHTML=cities[ci][1]+'<br>★ 2026 ★';hp.style.opacity=1},300)},4500);
hp.style.transition='opacity .3s';
</script>
