<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تسجيل الدخول · Deutsch mit Rawad</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Cairo:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
body{display:grid;place-items:center;padding:24px}
.login{display:grid;grid-template-columns:1.1fr 1fr;max-width:900px;width:100%;gap:0;padding:8px}
.pic{position:relative;min-height:440px;background:var(--bg2)}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.2s}
.pic img.on{opacity:1}
.pic .cap{position:absolute;inset-inline:0;bottom:0;padding:50px 18px 16px;background:linear-gradient(transparent,#000b);color:#fff;font:800 1.9rem 'Bricolage Grotesque';direction:ltr;z-index:2}
.pic .cap small{display:block;font:600 .85rem Cairo;opacity:.85}
.form{background:var(--card);padding:30px 28px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.form h1{font-size:2.5rem}.form h1 span{color:var(--acc)}
.form p{color:var(--mute)}
.f{display:block;border-bottom:2px solid var(--line);padding:6px 0;transition:.2s}.f:focus-within{border-color:var(--acc)}
.f small{color:var(--mute);font-weight:700}
.f input{width:100%;background:none;border:0;color:var(--ink);font:700 1.15rem 'Bricolage Grotesque',Cairo;padding:6px 0;outline:0;direction:ltr;text-align:left}
#msg{min-height:24px;font-weight:700;color:var(--bad)}
.tl{position:fixed;top:16px;inset-inline-start:16px}
@media(max-width:760px){.login{grid-template-columns:1fr}.pic{min-height:200px}}
</style>
</head>
<body>
<div class="themes tl" id="themes"></div>
<main class="stamp login"><div class="in" style="display:contents">
 <div class="pic" id="pic" aria-hidden="true">
  <img class="on" alt="" src="https://images.unsplash.com/photo-1560969184-10fe8719e047?auto=format&fit=crop&w=900&q=70" data-c="Berlin">
  <img alt="" data-src="https://images.unsplash.com/photo-1605649487212-47bdab064df7?auto=format&fit=crop&w=900&q=70" data-c="Hamburg">
  <img alt="" data-src="https://images.unsplash.com/photo-1529260830199-42c24126f198?auto=format&fit=crop&w=900&q=70" data-c="Köln">
  <img alt="" data-src="https://images.unsplash.com/photo-1565008576549-57569a49371d?auto=format&fit=crop&w=900&q=70" data-c="Dresden">
  <div class="cap"><small>مرحباً بك في</small><span id="city">Berlin</span> 🇩🇪</div>
 </div>
 <form class="form" id="f" novalidate>
  <div class="flagbar" style="width:70px;border-radius:4px"></div>
  <h1 class="disp">Willkommen<span>.</span></h1>
  <p>سجّل دخولك وكمّل تحضيرك للامتحان من وين وقفت.</p>
  <label class="f"><small>اسم المستخدم</small><input id="u" autocomplete="username" required></label>
  <label class="f"><small>كلمة المرور</small><input id="p" type="password" autocomplete="current-password" required></label>
  <div id="msg" role="alert"></div>
  <button class="btn" id="go" type="submit">دخول ←</button>
  <a class="back" href="https://t.me/mez123794" target="_blank" rel="noopener">ما عندك حساب؟ تواصل مع الأدمن على تيليغرام</a>
 </form>
</div></main>
<script src="supabase.js"></script>
<script>
mountThemes(document.getElementById('themes'));
if (checkSession()) location.replace('index.html');
const imgs=[...document.querySelectorAll('#pic img')];let i=0;
setTimeout(()=>imgs.forEach(m=>{if(m.dataset.src)m.src=m.dataset.src}),600);
setInterval(()=>{imgs[i].classList.remove('on');i=(i+1)%imgs.length;imgs[i].classList.add('on');document.getElementById('city').textContent=imgs[i].dataset.c},4200);
const f=document.getElementById('f'),msg=document.getElementById('msg'),go=document.getElementById('go');
f.addEventListener('submit',async e=>{
  e.preventDefault();msg.textContent='';
  const u=document.getElementById('u').value.trim(),p=document.getElementById('p').value.trim();
  if(!u||!p){msg.textContent='اكتب اسم المستخدم وكلمة المرور.';return}
  go.disabled=true;go.textContent='جاري التحقق…';
  const r=await loginUser(u,p);
  if(r.success){go.textContent='✓ أهلاً!';prefetchAll();setTimeout(()=>location.href='index.html',350)}
  else{msg.textContent=r.message||'اسم المستخدم أو كلمة المرور غير صحيحة.';go.disabled=false;go.textContent='دخول ←';f.animate([{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'none'}],{duration:260})}
});
</script>
</body>
</html>
